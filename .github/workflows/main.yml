name: Build React TypeScript APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project Code
        run: unzip -o gamemaster-ai.zip -d .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Add Capacitor Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init GameMaster com.gamemaster.app --web-dir dist || npx cap init GameMaster com.gamemaster.app --web-dir build
          npx cap add android
          npx cap sync android

      # Kotlin Conflict को ठीक करने के लिए Fix Step
      - name: Fix Kotlin Duplicate Classes
        run: |
          echo "configurations.all { resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22' }" >> android/app/build.gradle

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug -Pandroid.useAndroidX=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-master-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
